<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ADRIAN — official social links">
  <meta name="theme-color" content="#12051f">
  <title>ADRIAN ⚡ — Social Links</title>
  <style>
    :root{
      --bg:#07050b;
      --card:rgba(22,12,34,.72);
      --line:rgba(194,125,255,.20);
      --purple:#9b4dff;
      --purple2:#d28cff;
      --text:#fff;
      --muted:#b9aec6;
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; color:var(--text);
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 50% 0%, rgba(139,48,255,.25), transparent 34%),
        radial-gradient(circle at 0% 100%, rgba(95,25,180,.15), transparent 35%),
        var(--bg);
      display:flex; justify-content:center; overflow-x:hidden;
    }
    body:before{
      content:""; position:fixed; inset:-30%;
      background:conic-gradient(from 180deg, transparent, rgba(155,77,255,.07), transparent 30%);
      animation:spin 18s linear infinite; pointer-events:none;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .wrap{width:min(560px,100%); padding:34px 18px 44px; position:relative}
    .profile{text-align:center}
    .avatar{
      width:118px;height:118px;border-radius:50%;object-fit:cover;
      border:2px solid rgba(210,140,255,.85);
      box-shadow:0 0 0 7px rgba(155,77,255,.08),0 0 38px rgba(155,77,255,.38);
    }
    h1{margin:17px 0 4px;font-size:30px;letter-spacing:.5px}
    .handle{color:var(--muted);font-size:14px}
    .bio{margin:12px auto 25px;color:#d8d0df;max-width:420px;line-height:1.5}
    .links{display:grid;gap:13px}
    .link{
      position:relative; display:flex; align-items:center; gap:14px;
      padding:15px 18px; min-height:62px; text-decoration:none; color:white;
      border:1px solid var(--line); border-radius:18px;
      background:linear-gradient(135deg,rgba(32,17,48,.88),rgba(13,9,19,.82));
      backdrop-filter:blur(14px);
      box-shadow:0 8px 30px rgba(0,0,0,.24);
      transition:.22s ease;
      overflow:hidden;
    }
    .link:before{
      content:""; position:absolute; inset:0;
      background:linear-gradient(100deg,rgba(155,77,255,.14),transparent 45%);
      opacity:0; transition:.22s;
    }
    .link:hover{transform:translateY(-2px);border-color:rgba(210,140,255,.5);box-shadow:0 12px 35px rgba(93,33,160,.28)}
    .link:hover:before{opacity:1}
    .icon{
      width:40px;height:40px;display:grid;place-items:center;border-radius:12px;
      background:rgba(155,77,255,.14);color:var(--purple2);z-index:1;
      border:1px solid rgba(210,140,255,.12);
      box-shadow:inset 0 0 16px rgba(155,77,255,.08);
      flex:0 0 40px;
    }
    .icon svg{width:23px;height:23px;display:block}
    .name{font-weight:700;letter-spacing:.2px;z-index:1}
    .arrow{margin-left:auto;color:#9c8ca9;z-index:1;font-size:20px}
    footer{text-align:center;color:#766c7e;font-size:11px;margin-top:25px}
    @media(max-width:420px){.wrap{padding-top:24px}.avatar{width:104px;height:104px}h1{font-size:27px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="profile">
      <img class="avatar" src="profile.jpg" alt="ADRIAN profile photo">
      <h1>𝐀𝐃𝐑⚡️𝐀𝐍</h1>
      <div class="handle">Official social links</div>
      <p class="bio">Welcome to my official page. Find all my social accounts in one place.</p>
    </section>

    <nav class="links" aria-label="Social media links">
      <!-- Replace YOUR_USERNAME below with your real usernames/links. -->
      <a class="link" href="https://instagram.com/YOUR_USERNAME" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.3" cy="6.8" r="1.2" fill="currentColor"/></svg></span><span class="name">Instagram</span><span class="arrow">›</span>
      </a>
      <a class="link" href="https://facebook.com/YOUR_USERNAME" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14 8h3V4h-3c-3.3 0-5 2-5 5v3H6v4h3v4h4v-4h3.3l.7-4H13V9c0-.7.3-1 1-1z" fill="currentColor"/></svg></span><span class="name">Facebook</span><span class="arrow">›</span>
      </a>
      <a class="link" href="https://www.tiktok.com/@YOUR_USERNAME" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14 4v10.1a4.9 4.9 0 1 1-4-4.8v3.2a1.8 1.8 0 1 0 1.8 1.8V4h2.9c.4 1.8 1.5 3.1 3.3 3.7v3A7.1 7.1 0 0 1 14 9.1V4z" fill="currentColor"/></svg></span><span class="name">TikTok</span><span class="arrow">›</span>
      </a>
      <a class="link" href="https://www.snapchat.com/add/YOUR_USERNAME" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3.2c-3 0-5.1 2.1-5.1 5.2v2.3c0 1-.4 1.7-1.5 2.3-.6.3-.5 1 .1 1.2l2.3.7c.4.1.6.4.7.8.2.7.7 1 1.4 1.1.7.1 1.3.2 2.1.9.7.6 1.2.9 2 .9s1.3-.3 2-.9c.8-.7 1.4-.8 2.1-.9.7-.1 1.2-.4 1.4-1.1.1-.4.3-.7.7-.8l2.3-.7c.6-.2.7-.9.1-1.2-1.1-.6-1.5-1.3-1.5-2.3V8.4c0-3.1-2.1-5.2-5.1-5.2z" fill="currentColor"/></svg></span><span class="name">Snapchat</span><span class="arrow">›</span>

      <a class="link" href="https://t.me/YOUR_USERNAME" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20.5 4.1 3.7 10.6c-1.1.4-1.1 1.5-.2 1.8l4.3 1.3 1.7 5.2c.2.7.5.9 1 .9.4 0 .6-.2.9-.5l2.5-2.4 4.8 3.5c.9.5 1.5.1 1.7-.8l2.9-14.1c.2-1-.4-1.7-1.1-1.4zM9 13.2l8.7-5.5-6.9 6.4-.3 3.2-.1.8z" fill="currentColor"/></svg></span><span class="name">Telegram</span><span class="arrow">›</span>
      </a>
    </nav>

    <footer>© 2026 ADRIAN • No tracking or analytics added</footer>
  </main>
</body>
</html>
