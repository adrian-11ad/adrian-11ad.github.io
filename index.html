<head>

<title>𝐀𝐃𝐑⚡️𝐀𝐍 — All Social</title>

<style>
:root{
  --bg:#050307;
  --purple:#9b4dff;
  --purple2:#d29aff;
  --text:#fff;
  --muted:#b8adbf;
  --line:rgba(210,154,255,.20);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
.page{width:min(560px,100%);margin:auto;min-height:100vh;overflow:hidden;background:#050307}

/* Hero */
.hero{
  position:relative;
  min-height:555px;
  padding:28px 20px 30px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  text-align:center;
  background:
    linear-gradient(180deg,rgba(0,0,0,.02) 20%,rgba(0,0,0,.12) 42%,#050307 91%,#050307 100%),
    url("profile.jpg");
  background-size:cover;
  background-position:center top;
}
.hero:after{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 50% 15%,rgba(155,77,255,.10),transparent 35%),
    linear-gradient(180deg,transparent 35%,rgba(5,3,7,.18) 55%,rgba(5,3,7,.97) 92%);
  pointer-events:none;
}
.profile{position:relative;z-index:2;width:100%}

.avatar{
  width:104px;height:104px;border-radius:50%;object-fit:cover;
  border:2px solid rgba(255,255,255,.85);
  box-shadow:0 0 30px rgba(155,77,255,.45);
}

.name-row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  margin:14px 0 4px;
}
h1{
  margin:0;
  font-size:31px;
  line-height:1.1;
  letter-spacing:.3px;
}

/* Verification-style badge — decorative, not an Instagram-issued verification */
.verify-badge{
  width:25px;
  height:25px;
  display:block;
  flex:0 0 25px;
  filter:drop-shadow(0 0 7px rgba(112,91,255,.38));
}

.handle{
  color:#ddd4e2;
  font-size:15px;
  font-weight:700;
  margin-top:3px;
}

/* Decorative platform row */
.decor-title{
  margin:20px 0 10px;
  color:#fff;
  font-weight:800;
  font-size:14px;
  letter-spacing:.5px;
}
.social-strip{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:11px;
  flex-wrap:nowrap;
}
.social-dot{
  width:47px;height:47px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.17);
  box-shadow:0 7px 22px rgba(0,0,0,.28);
  transition:transform .18s,box-shadow .18s;
}
.social-dot:hover{
  transform:translateY(-2px) scale(1.04);
  box-shadow:0 10px 28px rgba(155,77,255,.30);
}
.social-dot img{width:24px;height:24px;object-fit:contain}

/* Followers */
.followers{
  margin:18px auto 0;
  font-size:25px;
  font-weight:800;
}
.followers span{
  font-size:15px;
  font-weight:500;
  color:#eee;
}

/* Actual link cards */
.content{padding:0 20px 30px}
.section-title{
  color:var(--purple2);
  font-size:15px;
  font-weight:800;
  margin:0 0 12px;
  letter-spacing:.4px;
}
.links{display:grid;gap:12px}
.link{
  position:relative;
  display:flex;
  align-items:center;
  gap:14px;
  min-height:66px;
  padding:12px 16px;
  border:1px solid var(--line);
  border-radius:18px;
  background:linear-gradient(135deg,rgba(25,14,38,.90),rgba(13,8,20,.86));
  color:var(--text);
  text-decoration:none;
  overflow:hidden;
  box-shadow:0 8px 28px rgba(0,0,0,.24);
  transition:transform .18s,border-color .18s,box-shadow .18s;
}
.link:before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,rgba(155,77,255,.14),transparent 65%);
  opacity:.55;
  pointer-events:none;
}
.link:hover{
  transform:translateY(-2px);
  border-color:rgba(210,154,255,.55);
  box-shadow:0 10px 34px rgba(80,20,130,.25);
}
.icon{
  width:42px;height:42px;flex:0 0 42px;
  display:grid;place-items:center;
  border-radius:13px;
  background:rgba(155,77,255,.15);
  border:1px solid rgba(210,154,255,.15);
  z-index:1;
}
.icon img{width:25px;height:25px;display:block;object-fit:contain}
.name{font-weight:700;letter-spacing:.2px;z-index:1}
.username{
  display:block;
  color:#988da0;
  font-size:11px;
  margin-top:3px;
  font-weight:500;
}
.arrow{margin-left:auto;color:#9c8ca9;font-size:24px;z-index:1}

footer{text-align:center;color:#766c7e;font-size:11px;margin-top:24px}

@media(max-width:420px){
  .hero{min-height:545px;padding-top:22px}
  h1{font-size:28px}
  .followers{font-size:23px}
  .social-strip{gap:8px}
  .social-dot{width:44px;height:44px}
}
</style>
</head>
