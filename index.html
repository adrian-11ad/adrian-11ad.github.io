<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07050b">
<meta name="description" content="ADRIAN — official social links">
<title>𝐀𝐃𝐑⚡️𝐀𝐍 — Social Links</title>
<style>
:root {
  --bg:#07050b; --card:rgba(22,12,34,.72); --line:rgba(194,125,255,.22);
  --purple:#9b4dff; --purple2:#d29aff; --text:#f7f2fb; --muted:#a99bb3;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:
radial-gradient(circle at 50% 0%,rgba(155,77,255,.18),transparent 34%),
linear-gradient(180deg,#09060e,#050307 80%);color:var(--text);
font-family:Arial,Helvetica,sans-serif}
.wrap{width:min(520px,100%);margin:auto;padding:42px 20px 28px}
.profile{text-align:center}
.avatar{width:116px;height:116px;border-radius:50%;object-fit:cover;
border:2px solid rgba(210,154,255,.65);box-shadow:0 0 32px rgba(155,77,255,.32)}
h1{margin:18px 0 5px;font-size:30px;letter-spacing:.5px}
.handle{color:var(--purple2);font-weight:700;font-size:14px}
.bio{color:var(--muted);font-size:14px;line-height:1.6;margin:10px auto 24px;max-width:390px}
.links{display:grid;gap:12px}
.link{position:relative;display:flex;align-items:center;gap:14px;min-height:66px;
padding:12px 16px;border:1px solid var(--line);border-radius:18px;
background:linear-gradient(135deg,rgba(25,14,38,.88),rgba(13,8,20,.82));
color:var(--text);text-decoration:none;overflow:hidden;
box-shadow:0 8px 28px rgba(0,0,0,.24);transition:transform .18s,border-color .18s,box-shadow .18s}
.link:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(155,77,255,.12),transparent 65%);
opacity:.5;pointer-events:none}
.link:hover{transform:translateY(-2px);border-color:rgba(210,154,255,.55);box-shadow:0 10px 34px rgba(80,20,130,.25)}
.icon{width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;
border-radius:13px;background:rgba(155,77,255,.15);border:1px solid rgba(210,154,255,.15);
z-index:1}
.icon img{width:25px;height:25px;display:block;object-fit:contain}
.name{font-weight:700;letter-spacing:.2px;z-index:1}
.arrow{margin-left:auto;color:#9c8ca9;font-size:24px;z-index:1}
footer{text-align:center;color:#766c7e;font-size:11px;margin-top:25px}
@media(max-width:420px){.wrap{padding-top:28px}.avatar{width:104px;height:104px}h1{font-size:27px}}
</style>
</head>
<body>
<main class="wrap">
<section class="profile">
<img class="avatar" src="profile.jpg" alt="ADRIAN profile photo">
<h1>𝐀𝐃𝐑⚡️𝐀𝐍</h1>
<div class="handle">Official social links</div>
<p class="bio">Welcome to my official page. Find all my social accounts in one place.</p>
</section>
<nav class="links" aria-label="Social media links">
      <a class="link" href="https://instagram.com/YOUR_USERNAME" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true"><img src="https://cdn.simpleicons.org/instagram/FFFFFF" alt=""></span>
        <span class="name">Instagram</span>
        <span class="arrow">›</span>
      </a>
      <a class="link" href="https://facebook.com/YOUR_USERNAME" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true"><img src="https://cdn.simpleicons.org/facebook/FFFFFF" alt=""></span>
        <span class="name">Facebook</span>
        <span class="arrow">›</span>
      </a>
      <a class="link" href="https://tiktok.com/@YOUR_USERNAME" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true"><img src="https://cdn.simpleicons.org/tiktok/FFFFFF" alt=""></span>
        <span class="name">TikTok</span>
        <span class="arrow">›</span>
      </a>
      <a class="link" href="https://snapchat.com/add/YOUR_USERNAME" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true"><img src="https://cdn.simpleicons.org/snapchat/FFFFFF" alt=""></span>
        <span class="name">Snapchat</span>
        <span class="arrow">›</span>
      </a>
      <a class="link" href="https://t.me/YOUR_USERNAME" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true"><img src="https://cdn.simpleicons.org/telegram/FFFFFF" alt=""></span>
        <span class="name">Telegram</span>
        <span class="arrow">›</span>
      </a>
</nav>
<footer>© 2026 ADRIAN • No tracking or analytics added</footer>
</main>
</body>
</html>
